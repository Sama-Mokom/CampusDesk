name: campusdesk-staging

x-backend-environment: &backend-environment
  APP_NAME: CampusDesk
  APP_ENV: staging
  APP_KEY: ${APP_KEY:?APP_KEY must be set}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL must be set}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}

  LOG_CHANNEL: stderr
  LOG_LEVEL: info

  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-campusdesk@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CampusDesk}

  BROADCAST_CONNECTION: reverb
  REALTIME_DELIVERY_ENABLED: ${REALTIME_DELIVERY_ENABLED:-true}
  REALTIME_REPLAY_HISTORICAL_BACKLOG: ${REALTIME_REPLAY_HISTORICAL_BACKLOG:-true}

  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID must be set}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY must be set}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET must be set}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-${FRONTEND_URL}}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging: *default-logging

  attachments-init:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: "no"
    user: "0:0"
    network_mode: "none"

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        path=/var/www/html/storage/app/private/attachments

        mkdir -p "$$path"
        chown www-data:www-data "$$path"
        chmod 0750 "$$path"

        test "$$(stat -c '%U:%G' "$$path")" = "www-data:www-data"
        test "$$(stat -c '%a' "$$path")" = "750"

    volumes:
      - attachments_data:/var/www/html/storage/app/private/attachments

    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    environment: *backend-environment

    volumes:
      - attachments_data:/var/www/html/storage/app/private/attachments

    depends_on:
      attachments-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging: *default-logging

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    command: php artisan queue:work --sleep=3 --tries=3 --backoff=5 --timeout=60 -v

    environment: *backend-environment

    volumes:
      - attachments_data:/var/www/html/storage/app/private/attachments

    depends_on:
      attachments-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    stop_signal: SIGTERM
    stop_grace_period: 70s

    logging: *default-logging

  realtime-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    command: php artisan queue:work database --queue=realtime --sleep=1 --timeout=30 -v

    environment: *backend-environment

    volumes:
      - attachments_data:/var/www/html/storage/app/private/attachments

    depends_on:
      attachments-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    stop_signal: SIGTERM
    stop_grace_period: 35s

    logging: *default-logging

  reverb:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    environment: *backend-environment

    depends_on:
      db:
        condition: service_healthy

    stop_signal: SIGTERM
    stop_grace_period: 15s

    logging: *default-logging

  scheduler:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    command: php artisan schedule:work

    environment: *backend-environment

    depends_on:
      db:
        condition: service_healthy

    stop_signal: SIGTERM
    stop_grace_period: 15s

    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    pull_policy: never
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_healthy
      reverb:
        condition: service_started

    logging: *default-logging

volumes:
  db_data:
  attachments_data:
