services:
  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./campusdesk
    image: campusdesk-backend:local

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    environment: &backend-environment
      APP_NAME: CampusDesk
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080

      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local

      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: campusdesk@example.com
      MAIL_FROM_NAME: CampusDesk

      BROADCAST_CONNECTION: reverb
      REALTIME_DELIVERY_ENABLED: ${REALTIME_DELIVERY_ENABLED:-true}
      REALTIME_REPLAY_HISTORICAL_BACKLOG: ${REALTIME_REPLAY_HISTORICAL_BACKLOG:-true}

      REVERB_APP_ID: ${REVERB_APP_ID:-campusdesk}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-campusdesk-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-campusdesk-secret}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080

    volumes:
      - ./docker-data/attachments:/var/www/html/storage/app/private/attachments

    depends_on:
      db:
        condition: service_healthy

  worker:
    image: campusdesk-backend:local

    command: php artisan queue:work --sleep=3 --tries=3 --backoff=5 --timeout=60 -v

    environment: *backend-environment

    volumes:
      - ./docker-data/attachments:/var/www/html/storage/app/private/attachments

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 70s

  realtime-worker:
    image: campusdesk-backend:local

    command: php artisan queue:work database --queue=realtime --sleep=1 --timeout=30 -v

    environment: *backend-environment

    volumes:
      - ./docker-data/attachments:/var/www/html/storage/app/private/attachments

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 35s

  reverb:
    image: campusdesk-backend:local

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    environment: *backend-environment

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  scheduler:
    image: campusdesk-backend:local

    command: php artisan schedule:work

    environment: *backend-environment

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api

    image: campusdesk-frontend:local

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy
      reverb:
        condition: service_started

volumes:
  db_data:
