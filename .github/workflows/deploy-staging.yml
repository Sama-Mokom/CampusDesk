name: Deploy CampusDesk staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full development commit SHA to deploy
        required: true
        type: string
      allow_previous_release:
        description: Deploy a published release older than the current deployment (rollback)
        required: false
        default: false
        type: boolean
      reason:
        description: Required when allow_previous_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: campusdesk-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify deployment ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$WORKFLOW_REF" != "refs/heads/development" ]]; then
            echo "Deployments must be dispatched from refs/heads/development (got '${WORKFLOW_REF}')."
            exit 1
          fi

      - name: Check out development history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release must be a full lowercase 40-character Git SHA."
            exit 1
          fi

          if ! git cat-file -e "${RELEASE_SHA}^{commit}"; then
            echo "The requested release does not exist in the repository history."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "The requested release is not part of the selected development history."
            exit 1
          fi

          echo "Release commit validated."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskStagingDeploy

      - name: Resolve release manifest
        id: images
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          set -euo pipefail

          set +e
          manifest="$(aws ssm get-parameter \
            --name "/campusdesk/releases/${RELEASE_SHA}" \
            --query Parameter.Value \
            --output text 2>&1)"
          manifest_status=$?
          set -e

          if (( manifest_status != 0 )); then
            if grep -q 'ParameterNotFound' <<< "$manifest"; then
              echo "No published release manifest exists for ${RELEASE_SHA}; wait for the publish job to finish."
            else
              echo "$manifest"
            fi
            exit 1
          fi

          if ! jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' >/dev/null <<< "$manifest"; then
            echo "The release manifest is invalid or does not match ${RELEASE_SHA}."
            exit 1
          fi

          backend_digest="$(jq -r '.backend.digest' <<< "$manifest")"
          frontend_digest="$(jq -r '.frontend.digest' <<< "$manifest")"
          digest_pattern='^sha256:[0-9a-f]{64}$'

          if [[ ! "$backend_digest" =~ $digest_pattern ]]; then
            echo "The release manifest's backend digest is invalid."
            exit 1
          fi

          if [[ ! "$frontend_digest" =~ $digest_pattern ]]; then
            echo "The release manifest's frontend digest is invalid."
            exit 1
          fi

          ecr_backend_digest="$(
            aws ecr describe-images \
              --repository-name "$BACKEND_REPOSITORY" \
              --image-ids "imageTag=$RELEASE_SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          ecr_frontend_digest="$(
            aws ecr describe-images \
              --repository-name "$FRONTEND_REPOSITORY" \
              --image-ids "imageTag=$RELEASE_SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ "$ecr_backend_digest" != "$backend_digest" ]]; then
            echo "The backend image tag does not match the release manifest."
            exit 1
          fi

          if [[ "$ecr_frontend_digest" != "$frontend_digest" ]]; then
            echo "The frontend image tag does not match the release manifest."
            exit 1
          fi

          if ! latest_sha="$(aws ssm get-parameter \
            --name /campusdesk/staging/latest \
            --query Parameter.Value \
            --output text 2>&1)"; then
            echo "The latest published release parameter is unavailable:"
            echo "$latest_sha"
            exit 1
          fi

          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The latest published release parameter is invalid."
            exit 1
          fi

          set +e
          last_deployed_sha="$(aws ssm get-parameter \
            --name /campusdesk/staging/last-deployed-sha \
            --query Parameter.Value \
            --output text 2>&1)"
          last_deployed_status=$?
          set -e

          if (( last_deployed_status != 0 )); then
            if grep -q 'ParameterNotFound' <<< "$last_deployed_sha"; then
              last_deployed_sha="unknown"
            else
              echo "$last_deployed_sha"
              exit "$last_deployed_status"
            fi
          fi

          if [[ "$last_deployed_sha" != "unknown" && ! "$last_deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The deployed release record is invalid."
            exit 1
          fi

          {
            echo "backend_digest=$backend_digest"
            echo "frontend_digest=$frontend_digest"
            echo "latest_sha=$latest_sha"
            echo "last_deployed_sha=$last_deployed_sha"
            echo "manifest_status=verified"
          } >> "$GITHUB_OUTPUT"

          echo "Release manifest verified; latest=${latest_sha}, deployed=${last_deployed_sha}."

      - name: Apply release selection
        id: selection
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          ALLOW_PREVIOUS_RELEASE: ${{ inputs.allow_previous_release }}
          REASON: ${{ inputs.reason }}
          LATEST_SHA: ${{ steps.images.outputs.latest_sha }}
          LAST_DEPLOYED_SHA: ${{ steps.images.outputs.last_deployed_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/development:refs/remotes/origin/development
          tip="$(git rev-parse origin/development)"
          mode=""

          if [[ "$RELEASE_SHA" == "$tip" && "$RELEASE_SHA" == "$LATEST_SHA" ]]; then
            if [[ "$LAST_DEPLOYED_SHA" != "unknown" ]] &&
               ! git merge-base --is-ancestor "$LAST_DEPLOYED_SHA" "$RELEASE_SHA"; then
              echo "The deployed release ${LAST_DEPLOYED_SHA} is not an ancestor of ${RELEASE_SHA}."
              echo "Use allow_previous_release=true with a reason for a deliberate rollback."
              exit 1
            fi
            mode="normal"
          elif [[ "$RELEASE_SHA" == "$LAST_DEPLOYED_SHA" ]]; then
            mode="idempotent"
          elif [[ "$ALLOW_PREVIOUS_RELEASE" == "true" ]]; then
            if [[ -z "${REASON//[[:space:]]/}" ]]; then
              echo "allow_previous_release requires a non-empty reason."
              exit 1
            fi
            if [[ "$LAST_DEPLOYED_SHA" != "unknown" ]] &&
               ! git merge-base --is-ancestor "$RELEASE_SHA" "$LAST_DEPLOYED_SHA"; then
              echo "${RELEASE_SHA} is not older than the deployed release ${LAST_DEPLOYED_SHA}."
              echo "Rollback targets must be ancestors of the deployed release."
              exit 1
            fi
            mode="rollback"
          else
            echo "${RELEASE_SHA} is not the current development tip (${tip}) or the latest published release (${LATEST_SHA})."
            echo "Use allow_previous_release=true with a reason to deploy a published older release."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selection mode: ${mode} (tip=${tip}, latest=${LATEST_SHA}, deployed=${LAST_DEPLOYED_SHA})."
          if [[ "$mode" == "rollback" ]]; then
            echo "Rollback reason: ${REASON}"
          fi

      - name: Send deployment command
        id: command
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
          SSM_DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          set -euo pipefail

          backend_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}@${BACKEND_DIGEST}"
          frontend_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}@${FRONTEND_DIGEST}"

          echo "::add-mask::$backend_image"
          echo "::add-mask::$frontend_image"

          parameters_file="${RUNNER_TEMP}/campusdesk-ssm-parameters.json"
          trap 'rm -f "$parameters_file"' EXIT

          jq -n \
            --arg release "$RELEASE_SHA" \
            --arg backend "$backend_image" \
            --arg frontend "$frontend_image" \
            '{
              ReleaseSha: [$release],
              BackendImage: [$backend],
              FrontendImage: [$frontend]
            }' > "$parameters_file"

          command_id="$(
            aws ssm send-command \
              --document-name "$SSM_DOCUMENT_NAME" \
              --document-version "1" \
              --instance-ids "$STAGING_INSTANCE_ID" \
              --comment "CampusDesk staging release ${RELEASE_SHA}" \
              --parameters "file://${parameters_file}" \
              --timeout-seconds 1200 \
              --max-concurrency "1" \
              --max-errors "0" \
              --query 'Command.CommandId' \
              --output text
          )"

          if [[ ! "$command_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Systems Manager did not return a valid command ID."
            exit 1
          fi

          echo "::add-mask::$command_id"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Deployment command accepted by Systems Manager."

      - name: Wait for deployment
        id: wait
        shell: bash
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1300))

          print_command_output() {
            local invocation="$1"
            local standard_output
            local standard_error

            standard_output="$(
              jq -r '.StandardOutputContent // empty' <<< "$invocation"
            )"

            standard_error="$(
              jq -r '.StandardErrorContent // empty' <<< "$invocation"
            )"

            if [[ -n "$standard_output" ]]; then
              printf '%s\n' '--- SSM standard output ---'
              printf '%s\n' "$standard_output"
            fi

            if [[ -n "$standard_error" ]]; then
              printf '%s\n' '--- SSM standard error ---'
              printf '%s\n' "$standard_error"
            fi
          }

          while (( SECONDS < deadline )); do
            set +e

            invocation="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$STAGING_INSTANCE_ID" \
                --output json 2>&1
            )"

            invocation_status=$?

            set -e

            if (( invocation_status != 0 )); then
              if grep -q 'InvocationDoesNotExist' <<< "$invocation"; then
                sleep 5
                continue
              fi

              printf '%s\n' "$invocation"
              exit "$invocation_status"
            fi

            command_status="$(jq -r '.Status' <<< "$invocation")"

            case "$command_status" in
              Success)
                print_command_output "$invocation"

                standard_output="$(
                  jq -r '.StandardOutputContent // empty' <<< "$invocation"
                )"

                runtime_sha="$(
                  grep -oE 'runtime_sha=[0-9a-f]{40}' <<< "$standard_output" |
                    head -n1 | cut -d= -f2 || true
                )"
                runtime_build_time="$(
                  grep -oE 'runtime_build_time=[^[:space:]]+' <<< "$standard_output" |
                    head -n1 | cut -d= -f2- || true
                )"
                frontend_build_sha="$(
                  grep -oE 'frontend_build_sha=[0-9a-f]{40}' <<< "$standard_output" |
                    head -n1 | cut -d= -f2 || true
                )"
                frontend_meta_sha="$(
                  grep -oE 'frontend_meta_sha=[0-9a-f]{40}' <<< "$standard_output" |
                    head -n1 | cut -d= -f2 || true
                )"

                [[ "$runtime_sha" == "$RELEASE_SHA" ]] || {
                  echo "The host reported runtime_sha='${runtime_sha}', expected ${RELEASE_SHA}."
                  exit 1
                }
                [[ -n "$runtime_build_time" ]] || {
                  echo "The host reported no runtime build time."
                  exit 1
                }
                [[ "$frontend_build_sha" == "$RELEASE_SHA" ]] || {
                  echo "The host reported frontend_build_sha='${frontend_build_sha}', expected ${RELEASE_SHA}."
                  exit 1
                }
                [[ "$frontend_meta_sha" == "$RELEASE_SHA" ]] || {
                  echo "The host reported frontend_meta_sha='${frontend_meta_sha}', expected ${RELEASE_SHA}."
                  exit 1
                }

                {
                  echo "ssm_status=Success"
                  echo "runtime_sha=$runtime_sha"
                  echo "runtime_build_time=$runtime_build_time"
                  echo "frontend_build_sha=$frontend_build_sha"
                  echo "frontend_meta_sha=$frontend_meta_sha"
                } >> "$GITHUB_OUTPUT"

                echo "Deployment completed successfully."
                exit 0
                ;;

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              *)
                print_command_output "$invocation"
                echo "Deployment failed with SSM status: $command_status"
                exit 1
                ;;
            esac
          done

          echo "Timed out while waiting for the deployment command."
          echo "The SSM command might still be running; inspect it before retrying."
          exit 1

      - name: Verify deployment record
        id: record
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          set +e
          recorded="$(aws ssm get-parameter \
            --name /campusdesk/staging/last-deployed-sha \
            --query Parameter.Value \
            --output text 2>&1)"
          status=$?
          set -e

          if (( status != 0 )); then
            if grep -q 'ParameterNotFound' <<< "$recorded"; then
              echo "No /campusdesk/staging/last-deployed-sha record exists yet; the host record update (PR C) is not installed."
              echo "record_status=skipped" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$recorded"
            exit "$status"
          fi

          if [[ "$recorded" != "$RELEASE_SHA" ]]; then
            echo "The deployment record is ${recorded}, expected ${RELEASE_SHA}."
            echo "The application may be deployed, but the release record is not current."
            exit 1
          fi

          echo "record_status=verified" >> "$GITHUB_OUTPUT"
          echo "Deployment record confirmed: ${recorded}."

      - name: Write deployment summary
        if: ${{ success() }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
          MANIFEST_STATUS: ${{ steps.images.outputs.manifest_status }}
          SELECTION_MODE: ${{ steps.selection.outputs.mode }}
          LATEST_SHA: ${{ steps.images.outputs.latest_sha }}
          LAST_DEPLOYED_SHA: ${{ steps.images.outputs.last_deployed_sha }}
          REASON: ${{ inputs.reason }}
          RECORD_STATUS: ${{ steps.record.outputs.record_status }}
          SSM_STATUS: ${{ steps.wait.outputs.ssm_status }}
          RUNTIME_SHA: ${{ steps.wait.outputs.runtime_sha }}
          RUNTIME_BUILD_TIME: ${{ steps.wait.outputs.runtime_build_time }}
          FRONTEND_BUILD_SHA: ${{ steps.wait.outputs.frontend_build_sha }}
          FRONTEND_META_SHA: ${{ steps.wait.outputs.frontend_meta_sha }}
        run: |
          set -euo pipefail

          {
            echo "### CampusDesk staging deployment"
            echo
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Workflow ref: \`$WORKFLOW_REF\`"
            echo "- Selection: \`$SELECTION_MODE\`"
            echo "- Latest published: \`$LATEST_SHA\`"
            echo "- Previously deployed: \`$LAST_DEPLOYED_SHA\`"
            if [[ "$SELECTION_MODE" == "rollback" ]]; then
              echo "- Rollback reason: $REASON"
            fi
            echo "- Backend digest: \`$BACKEND_DIGEST\`"
            echo "- Frontend digest: \`$FRONTEND_DIGEST\`"
            echo "- Release manifest: \`$MANIFEST_STATUS\`; images match ECR"
            echo "- SSM deployment: \`$SSM_STATUS\`"
            echo "- Runtime /api/version: \`$RUNTIME_SHA\` (built \`$RUNTIME_BUILD_TIME\`)"
            echo "- Frontend build: \`$FRONTEND_BUILD_SHA\` (meta \`$FRONTEND_META_SHA\`)"
            echo "- Deployment record: \`$RECORD_STATUS\`"
            echo "- Host release record: \`/opt/campusdesk/release.json\`"
            echo
            echo "Host health-check and smoke-test output is in the SSM standard output above."
          } >> "$GITHUB_STEP_SUMMARY"
