name: CampusDesk CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: campusdesk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP environment
        run: |
          php --version
          composer --version
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests
        run: composer test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  staging-config:
    name: Staging Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate staging Compose configuration
        run: >
          docker compose
          --env-file .env.staging.example
          --file compose.staging.yaml
          config --quiet

  backend-image:
    name: Backend image build
    if: github.event_name != 'push'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag campusdesk-backend:ci ./campusdesk

  frontend-image:
    name: Frontend image build
    if: github.event_name != 'push'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api --tag campusdesk-frontend:ci ./Frontend

  backend-publish:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskBackendPublish

      - name: Check for existing backend image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          output="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Backend image $IMAGE_TAG already exists; skipping publication."
          elif grep -q "ImageNotFoundException" <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend image $IMAGE_TAG does not exist; publishing it."
          else
            echo "$output"
            exit "$status"
          fi

      - name: Check out repository
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v7

      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" ./campusdesk
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"

  frontend-publish:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskFrontendPublish

      - name: Check for existing frontend image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          output="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frontend image $IMAGE_TAG already exists; skipping publication."
          elif grep -q "ImageNotFoundException" <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend image $IMAGE_TAG does not exist; publishing it."
          else
            echo "$output"
            exit "$status"
          fi

      - name: Check out repository
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v7

      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg VITE_API_URL=/api \
            --tag "$IMAGE_URI" \
            ./Frontend
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"
