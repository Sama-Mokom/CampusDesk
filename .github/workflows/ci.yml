name: CampusDesk CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: campusdesk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP environment
        run: |
          php --version
          composer --version
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests
        run: composer test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  backend-image:
    name: Backend image build
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag campusdesk-backend:ci ./campusdesk

  frontend-image:
    name: Frontend image build
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api --tag campusdesk-frontend:ci ./Frontend

  aws-identity:
    name: Verify AWS identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend-image
      - frontend-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskGitHubActions

      - name: Verify assumed role
        run: aws sts get-caller-identity
