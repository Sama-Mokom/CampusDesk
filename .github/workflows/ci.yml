name: CampusDesk CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: campusdesk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP environment
        run: |
          php --version
          composer --version
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests
        run: composer test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  backend-image:
    name: Backend image build
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag campusdesk-backend:ci ./campusdesk

  frontend-image:
    name: Frontend image build
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api --tag campusdesk-frontend:ci ./Frontend
