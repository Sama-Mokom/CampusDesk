name: CampusDesk CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: campusdesk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP environment
        run: |
          php --version
          composer --version
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests
        run: composer test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  staging-config:
    name: Staging Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate staging Compose configuration
        run: >
          docker compose
          --env-file .env.staging.example
          --file compose.staging.yaml
          config --quiet

  backend-image:
    name: Backend image build
    if: github.event_name != 'push'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag campusdesk-backend:ci \
            ./campusdesk

  frontend-image:
    name: Frontend image build
    if: github.event_name != 'push'
    needs:
      - backend
      - frontend
      - staging-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_REVERB_APP_KEY=campusdesk-key \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag campusdesk-frontend:ci \
            ./Frontend

  backend-publish:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend
      - frontend
      - staging-config
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskBackendPublish

      - name: Check for existing backend image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          output="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Backend image $IMAGE_TAG already exists; skipping publication."
          elif grep -q "ImageNotFoundException" <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend image $IMAGE_TAG does not exist; publishing it."
          else
            echo "$output"
            exit "$status"
          fi

      - name: Check out repository
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v7

      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE_URI" \
            ./campusdesk
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"

      - name: Resolve published digest
        id: publish
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          digest="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The published backend image did not resolve to a valid digest."
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  frontend-publish:
    name: Publish frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend
      - frontend
      - staging-config
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskFrontendPublish

      - name: Check for existing frontend image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set +e
          output="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frontend image $IMAGE_TAG already exists; skipping publication."
          elif grep -q "ImageNotFoundException" <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend image $IMAGE_TAG does not exist; publishing it."
          else
            echo "$output"
            exit "$status"
          fi

      - name: Check out repository
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v7

      - name: Log in to Amazon ECR
        if: steps.image.outputs.exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_REVERB_APP_KEY=campusdesk-key \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE_URI" \
            ./Frontend
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"

      - name: Resolve published digest
        id: publish
        shell: bash
        env:
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          digest="$(
            aws ecr describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The published frontend image did not resolve to a valid digest."
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release-manifest:
    name: Publish release manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend-publish
      - frontend-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskReleaseManifest

      - name: Build release manifest
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          BACKEND_DIGEST: ${{ needs.backend-publish.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend-publish.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release SHA is not a full lowercase commit SHA."
            exit 1
          fi

          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The backend digest is missing or invalid."
            exit 1
          fi

          if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The frontend digest is missing or invalid."
            exit 1
          fi

          created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          jq -cn \
            --arg sha "$RELEASE_SHA" \
            --arg ref "$RELEASE_REF" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg created_at "$created_at" \
            --arg backend_repository "$BACKEND_REPOSITORY" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg frontend_repository "$FRONTEND_REPOSITORY" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            '{
              schema: 1,
              sha: $sha,
              ref: $ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              created_at: $created_at,
              backend: {
                repository: $backend_repository,
                tag: $sha,
                digest: $backend_digest
              },
              frontend: {
                repository: $frontend_repository,
                tag: $sha,
                digest: $frontend_digest
              }
            }' > release-manifest.json

          echo "Release manifest:"
          cat release-manifest.json

      - name: Publish release parameters
        id: publish
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          manifest="$(cat release-manifest.json)"

          aws ssm put-parameter \
            --name "/campusdesk/releases/${RELEASE_SHA}" \
            --type String \
            --value "$manifest" \
            --description "CampusDesk release manifest for ${RELEASE_SHA}" \
            --overwrite

          git fetch --no-tags origin \
            +refs/heads/development:refs/remotes/origin/development

          tip="$(git rev-parse origin/development)"
          latest_updated=false

          if [[ "$RELEASE_SHA" == "$tip" ]]; then
            aws ssm put-parameter \
              --name "/campusdesk/staging/latest" \
              --type String \
              --value "$RELEASE_SHA" \
              --description "Latest published CampusDesk release" \
              --overwrite
            latest_updated=true
            echo "Updated /campusdesk/staging/latest to ${RELEASE_SHA}."
          else
            echo "Latest unchanged: ${RELEASE_SHA} is not the current development tip (${tip})."
          fi

          echo "latest_updated=$latest_updated" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release-manifest.json
          retention-days: 90

      - name: Write release summary
        if: ${{ success() }}
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          LATEST_UPDATED: ${{ steps.publish.outputs.latest_updated }}
        run: |
          set -euo pipefail

          {
            echo "### CampusDesk release manifest"
            echo
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Manifest parameter: \`/campusdesk/releases/$RELEASE_SHA\`"
            echo "- Latest parameter updated: \`$LATEST_UPDATED\`"
            echo
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
