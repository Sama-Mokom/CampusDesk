name: CampusDesk CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: campusdesk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP environment
        run: |
          php --version
          composer --version
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run backend tests
        run: composer test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  staging-config:
    name: Staging Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate staging Compose configuration
        run: >
          docker compose
          --env-file .env.staging.example
          --file compose.staging.yaml
          config --quiet

  validate-images:
    name: Validate images (PR)
    if: github.event_name != 'push'
    needs:
      - backend
      - frontend
      - staging-config
    permissions:
      contents: read
    uses: ./.github/workflows/build-images.yml
    with:
      push: false
      image_tag: ${{ github.sha }}

  publish-images:
    name: Publish release images (development)
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - backend
      - frontend
      - staging-config
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
      image_tag: ${{ github.sha }}

  release-manifest:
    name: Publish release manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: CampusDeskReleaseManifest

      - name: Build release manifest
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          BACKEND_DIGEST: ${{ needs.publish-images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish-images.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release SHA is not a full lowercase commit SHA."
            exit 1
          fi

          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The backend digest is missing or invalid."
            exit 1
          fi

          if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The frontend digest is missing or invalid."
            exit 1
          fi

          created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          jq -cn \
            --arg sha "$RELEASE_SHA" \
            --arg ref "$RELEASE_REF" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg created_at "$created_at" \
            --arg backend_repository "$BACKEND_REPOSITORY" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg frontend_repository "$FRONTEND_REPOSITORY" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            '{
              schema: 1,
              sha: $sha,
              ref: $ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              created_at: $created_at,
              backend: {
                repository: $backend_repository,
                tag: $sha,
                digest: $backend_digest
              },
              frontend: {
                repository: $frontend_repository,
                tag: $sha,
                digest: $frontend_digest
              }
            }' > release-manifest.json

          echo "Release manifest:"
          cat release-manifest.json

      - name: Publish release parameters
        id: publish
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          manifest="$(cat release-manifest.json)"

          aws ssm put-parameter \
            --name "/campusdesk/releases/${RELEASE_SHA}" \
            --type String \
            --value "$manifest" \
            --description "CampusDesk release manifest for ${RELEASE_SHA}" \
            --overwrite

          git fetch --no-tags origin \
            +refs/heads/development:refs/remotes/origin/development

          tip="$(git rev-parse origin/development)"
          latest_updated=false

          if [[ "$RELEASE_SHA" == "$tip" ]]; then
            aws ssm put-parameter \
              --name "/campusdesk/staging/latest" \
              --type String \
              --value "$RELEASE_SHA" \
              --description "Latest published CampusDesk release" \
              --overwrite
            latest_updated=true
            echo "Updated /campusdesk/staging/latest to ${RELEASE_SHA}."
          else
            echo "Latest unchanged: ${RELEASE_SHA} is not the current development tip (${tip})."
          fi

          echo "latest_updated=$latest_updated" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release-manifest.json
          retention-days: 90

      - name: Write release summary
        if: ${{ success() }}
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          LATEST_UPDATED: ${{ steps.publish.outputs.latest_updated }}
        run: |
          set -euo pipefail

          {
            echo "### CampusDesk release manifest"
            echo
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Manifest parameter: \`/campusdesk/releases/$RELEASE_SHA\`"
            echo "- Latest parameter updated: \`$LATEST_UPDATED\`"
            echo
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
